[package]
name = "gaokun-boot"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "Custom graphical multi-OS UEFI boot manager for Huawei MateBook E Go (SC8280XP / gaokun3)"

[dependencies]
uefi = { version = "0.35", features = ["alloc", "global_allocator", "panic_handler"] }
uefi-raw = "0.11"
